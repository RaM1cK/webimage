name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      context: server
      file: Dockerfile
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      set-meta-labels: true
      set-meta-annotations: true
      meta-images: ${{ vars.DOCKERHUB_USERNAME }}/webimage-server
      meta-tags: |
        type=sha
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
