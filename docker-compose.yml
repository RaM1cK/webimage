services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webimage}
      POSTGRES_USER: ${POSTGRES_USER:-webimage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webimage}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      PERSISTENCE: "1"
    volumes:
      - localstack_data:/var/lib/localstack
    ports:
      - "4566:4566"

  server:
    container_name: webimage-server
    build:
      context: ./server
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://localstack:4566
      S3_PUBLIC_ENDPOINT_URL: http://localhost:4566
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
    depends_on:
      - postgres
      - redis
      - localstack
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app

  client:
    build:
      context: ./client
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:5000/api
    depends_on:
      - server
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres_data:
  localstack_data:
